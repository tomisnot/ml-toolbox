# -*- coding: utf-8 -*-
# ML Toolbox 包元数据（B3）。
#
# 为什么此前没有、现在补：本仓只有 requirements.txt，而 **AI 模式的三项依赖
# （mecha / mcp / uvicorn）一个都没声明**——今天能跑只是因为这台机器恰好装好了；
# 换机器或重建环境时表现为"import 失败"，查起来要半天（环境漂移）。
#
# ## 与 requirements.txt 的分工（**有意分工，不是两份真相**）
#   - `requirements.txt` = 「把整台软件跑起来」的安装清单（GUI 全量 + 版本下限），
#     仍是 README / docs/交付说明.md 里的主路径，**本次不动**；
#   - 本文件 = 包元数据 + 可安装性 + **按用途分组的 extras**（AI / 神经网络 / 优化引擎）。
#   两边列出的直接依赖**口径一致**，且都按"代码实际 import"取证（不写"将来可能需要"）。
#
# ## `mecha` 的声明（开源后改口径；2026-09-28 钉 tag）
# 它是**宿主框架**，AI 模式必需、GUI 模式完全不需要 ⇒ 声明在 **`ai` extra** 里，
# 用 **URL 依赖**（PEP 508 direct reference）并**钉到 tag**：
# `mecha @ git+https://github.com/tomisnot/mecha@v0.2.0`
#   - **为什么可以钉了**：上游 `v0.2.0` 已发布（annotated tag → `4c6544d`，与它自己
#     `pyproject.toml` 的 `version = "0.2.0"` 一致），且上游历史**已定稿、不会再重写**
#     ⇒ tag 不会漂。（此前不钉的理由——"无 tag + 历史仍在重写"——已消失。）
#   - 钉 tag 而不是 SHA：tag 是可读的发布点，SHA 只在"上游没有 tag"时才更稳。
#   - **为什么不写本地路径**：`file://` 绝对/相对路径会把"环境漂移"从"未声明"换成"路径失效"
#     （换机器/换盘符/换目录名就崩）。
#   - ⚠ **`github.com/tomisnot/mecha` 目前仍返回 404**（账号 `tomisnot` 存在=200，仓未建/未公开）
#     ⇒ **上游仓建好之后这个 URL 才可解析**；否则 `pip install -e ".[ai]"` 会因"仓库不存在"失败。
#     （与 tag 无关：tag 已在本地上游仓里打好了。）
#   - **本地开发**仍走 `requirements.txt` 的 `-e ../mecha`（兄弟仓可编辑安装）；
#     两条路**同一事实、不同场合**：公开安装用 URL+tag，本机开发用可编辑安装。
#
# ## 未声明的东西（不是遗漏）
#   - `[project.scripts]`：入口仍是仓库根的 `python launcher.py`（看门人）/
#     `python app.py`（GUI）/ `app_entry.py --authority`（headless 权威）。
#     控制台脚本会改变交付形态（需要把根级脚本变成可导入模块），本次不做。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-toolbox"
description = "机器学习方法试验台：可 import 的方法库 + PyQt5 桌面软件 + AI 模式（mecha 宿主）"
readme = "README.md"
requires-python = ">=3.10"
#: 许可（PEP 621 的旧式 `{text=...}` 写法：本机 setuptools 是 65.x，SPDX 字符串要 ≥77）。
#: 与仓库根的 `LICENSE`（MIT / Copyright (c) 2026 tomisnot）一致——**一处事实、两处露面**。
license = {text = "MIT"}
#: 版本**单一来源**：ml_toolbox/__init__.py 的 __version__（不在这里再抄一份，
#: 免得多出第三个会漂移的版本号——见 内部记录（未随仓发布，存档在仓外） 的 R10）。
dynamic = ["version"]
#: 直接依赖 = 代码里**实际 import** 的第三方（逐文件取证；不含仅传递依赖）。
#: scipy 刻意不列：全仓零直接 import（sklearn/statsmodels 会传递带来它）——
#: 与 requirements.txt 的口径差异已上报主代理。
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",       # HDBSCAN 需要 1.3+
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "umap-learn>=0.5",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
#: AI 模式：宿主框架 mecha + MCP 工具服务（streamable-http）+ 只读监控端点。
#: mecha 是 URL 依赖并**钉到 tag `v0.2.0`**（见上方说明；上游仓建好后该 URL 才可解析）。
#: `mcp>=2.2,<3`：`MCPServer` 与 `_tool_manager.get_tool` 是 2.2 的形状；
#: `uvicorn` 是被**直接** import 的，不是仅传递依赖。
ai = [
    "mecha @ git+https://github.com/tomisnot/mecha@v0.2.0",
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
]
#: 神经网络方法族（torch_mlp）。未装时其余方法照常可用。
neural = ["torch>=2.0"]
#: 优化框架的 TPE/ASHA 引擎适配。未装时自研引擎照常可用。
optuna = ["optuna>=3.0"]

[tool.setuptools.packages.find]
#: 只发两个 Python 包。显式 include（不用 flat-layout 自动发现）：
#: `dsh/` 是 Node 插件（无 __init__.py）、`tests/`/`checks/`/`benchmarks/` 不是包、
#: `old/machine_learning/` 是带自己 .git 的历史归档——自动发现会把它们卷进来或直接
#: 报"Multiple top-level packages discovered"。
include = ["ml_mecha*", "ml_toolbox*"]

[tool.setuptools.dynamic]
version = {attr = "ml_toolbox.__version__"}
